# Render Blueprint (simplified like DjPOS). Secrets: set in Dashboard.
services:
  - type: web
    runtime: python
    name: monAI
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate --noinput && \
      gunicorn budget_tracker.wsgi:application
    envVars:
      - key: ALLOWED_HOSTS
        value: monai-42qk.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://monai-42qk.onrender.com
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
