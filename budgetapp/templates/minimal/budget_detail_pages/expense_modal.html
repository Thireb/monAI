<!-- Complete Expense Modal -->
<!-- djlint:off H021 -->
<div id="expenseModal" class="modal-minimal" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="expenseModalLabel" style="display: none;">
    <!-- djlint:on H021 -->
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="expenseModalLabel">Add/Edit Expense</h3>
        </div>
        <form method="post" id="expense-form" class="expense-form"
            action="{% url 'minimal:expense_create_update' year=budget.month.year month=budget.month.month %}">
            {% csrf_token %}
            <div class="modal-body">
                <!-- Expense Modal Form Fields -->
                <input type="hidden" name="expense_id" id="expense_id" value="">
                <div class="mb-3">
                    <label for="expense_name" class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" id="expense_name"
                        placeholder="e.g., Rent, Groceries, Utilities" required aria-label="Expense name">
                    <div class="form-text">Enter a clear, descriptive name for the expense</div>
                </div>
                <div class="mb-3">
                    <label for="expense_amount" class="form-label">Amount</label>
                    <input type="number" step="0.01" name="amount" class="form-control" id="expense_amount"
                        placeholder="Enter amount" required aria-label="Expense amount">
                    <div class="form-text">Enter the expense amount in {{ budget.currency }}</div>
                </div>
                <div class="mb-3">
                    <label for="expense_category" class="form-label">Category</label>
                    <select name="category" id="expense_category" class="form-select" aria-label="Expense category">
                        <option value="">Select a category</option>
                        {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                    <div class="form-text">Group your expenses for better tracking</div>
                </div>
                <div class="mb-3">
                    <label for="expense_tag_foreign_key" class="form-label">Account Tag</label>
                    <select name="tag" id="expense_tag_foreign_key" class="form-select" aria-label="Expense tag">
                        <option value="">No Tag</option>
                        {% for tag in tags %}
                        <option value="{{ tag.id }}">{{ tag.name }}</option>
                        {% endfor %}
                    </select>
                    <div class="form-text">Select the account for this expense</div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_recurring" class="form-check-input" id="expense_recurring"
                        aria-label="Recurring expense">
                    <label class="form-check-label" for="expense_recurring">Recurring Expense</label>
                    <div class="form-text">Check if this is a monthly recurring expense</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-minimal expense-cancel-btn" aria-label="Cancel">Cancel</button>
                <button type="submit" class="btn btn-minimal btn-success" id="expense-submit-btn"
                    aria-label="Save expense">
                    <i class="material-icons align-middle"></i> Save
                </button>
            </div>
        </form>
    </div>
</div>
