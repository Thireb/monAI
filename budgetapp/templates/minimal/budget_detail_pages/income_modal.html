<!-- Complete Income Modal -->
<!-- djlint:off H021 -->
<div id="incomeModal" class="modal-minimal" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="incomeModalLabel" style="display: none;">
    <!-- djlint:on H021 -->
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="incomeModalLabel">Edit Income</h3>
        </div>
        <form method="post" id="income-form" class="income-form" action="{% url 'minimal:income_update' year=budget.month.year month=budget.month.month %}">
            {% csrf_token %}
            <div class="modal-body">
                <!-- Income Modal Form Fields -->
                <div class="mb-3">
                    <label for="income" class="form-label">Monthly Income</label>
                    <input type="number" step="0.01" name="income" id="income" value="{{ budget.income }}"
                        class="form-control" placeholder="Enter your monthly income" required>
                    <div class="form-text">Enter your total monthly income before expenses</div>
                </div>
                <div class="mb-3">
                    <label for="currency" class="form-label">Currency</label>
                    <select name="currency" id="currency" class="form-select">
                        {% for code, name in currency_choices %}
                        <option value="{{ code }}" {% if budget.currency == code %}selected{% endif %}>{{ name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="reason" class="form-label">Reason for Change</label>
                    <textarea name="reason" id="reason" class="form-control" rows="3"
                        placeholder="e.g., Salary increase, Additional income source"></textarea>
                    <div class="form-text">Helps you track why income changes over time</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-minimal income-cancel-btn" aria-label="Cancel">Cancel</button>
                <button type="submit" class="btn btn-minimal btn-success" id="income-submit-btn" aria-label="Save">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
