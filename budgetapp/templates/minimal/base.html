<!DOCTYPE html>
<html lang="en">
    {% load static %}

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="A personal budget tracking application to help manage expenses, income, and financial goals">
        <meta name="keywords" content="budget, expenses, income, finance, money, savings, goals, financial planning">
        <title>Budget Tracker - Minimal Theme</title>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/minimal-css/theme/theme.css' %}">
        <link rel="stylesheet" href="{% static 'css/minimal-css/nav/nav.css' %}">
        <link rel="stylesheet" href="{% static 'css/minimal-css/calculator/calculator.css' %}">
        {% block extra_css %}{% endblock extra_css %}
    </head>

    <body>
        {% include "minimal/components/nav.html" %}
        <div class="container mt-4">
            {% block content %}{% endblock content %}
        </div>
        {% include "minimal/components/calculator.html" %}

        <!-- Floating Calculator Button (removed, now accessible from nav) -->

        <script src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js" defer></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
        <script src="{% static 'js/minimal-js/nav/nav.js' %}"></script>
        <script src="{% static 'js/minimal-js/calculator/calculator.js' %}"></script>
        {% block extra_js %}{% endblock extra_js %}
    </body>

</html>
