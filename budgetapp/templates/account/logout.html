{% extends "account/base.html" %}
{% load static %}

{% block title %}Sign Out - monAI{% endblock title %}

{% block content %}
<div class="auth-header">
    <h1 class="auth-title">See You Soon!</h1>
    <p class="auth-subtitle">You have been signed out successfully</p>
</div>

<div class="logout-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
</div>

<div class="auth-actions">
    <a href="{% url 'account_login' %}" class="btn btn-primary btn-auth">
        Sign In Again
    </a>
</div>

<div class="auth-footer">
    <p>Thanks for using monAI!</p>
</div>
{% endblock content %}
