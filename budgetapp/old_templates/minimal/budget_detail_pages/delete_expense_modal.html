<!-- Delete Expense Confirmation Modal -->
<!-- djlint:off H021 -->
<div id="deleteExpenseModal" class="modal-minimal" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="deleteExpenseModalLabel" style="display: none;">
    <!-- djlint:on H021 -->
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="deleteExpenseModalLabel">Delete Expense</h3>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete this expense?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-minimal delete-cancel-btn" aria-label="Cancel">Cancel</button>
            <button type="button" class="btn btn-minimal btn-danger delete-confirm-btn"
                aria-label="Delete">Delete</button>
        </div>
    </div>
</div>
