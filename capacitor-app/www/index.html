<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>monAI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f3f6fa 0%, #e9eafc 100%);
            text-align: center;
        }
        .error-logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #2196f3 0%, #4caf50 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .error-message {
            color: #666;
            font-size: 1rem;
            max-width: 300px;
            line-height: 1.5;
        }
        .retry-btn {
            margin-top: 2rem;
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }
        .retry-btn:active {
            transform: scale(0.98);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Main app iframe - URL is replaced by build script -->
    <iframe id="app" src="https://preinstructive-dilan-evaluatingly.ngrok-free.dev"></iframe>
    
    <!-- Error screen (hidden by default) -->
    <div id="error-screen" class="error-container hidden">
        <div class="error-logo">monAI</div>
        <h2 class="error-title">Connection Failed</h2>
        <p class="error-message">
            Cannot connect to the server. Please check your internet connection 
            and ensure the server is running.
        </p>
        <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
    </div>

    <script>
        const appFrame = document.getElementById('app');
        const errorScreen = document.getElementById('error-screen');
        
        // Track load attempts
        let loadAttempts = 0;
        const maxAttempts = 3;
        
        function showError() {
            appFrame.classList.add('hidden');
            errorScreen.classList.remove('hidden');
        }
        
        function retryConnection() {
            loadAttempts = 0;
            errorScreen.classList.add('hidden');
            appFrame.classList.remove('hidden');
            // Force reload the iframe
            const currentSrc = appFrame.src;
            appFrame.src = '';
            setTimeout(() => { appFrame.src = currentSrc; }, 100);
        }
        
        // Handle iframe load errors
        appFrame.addEventListener('error', function() {
            loadAttempts++;
            if (loadAttempts >= maxAttempts) {
                showError();
            }
        });
        
        // Also handle cases where iframe loads but content fails
        // (e.g., server returns error page)
        appFrame.addEventListener('load', function() {
            try {
                // If we can't access contentWindow, it might be a CORS error
                // which is expected with external URLs
                loadAttempts = 0; // Reset on successful load
            } catch (e) {
                // CORS error is expected, don't treat as failure
            }
        });
        
        // Timeout fallback - if iframe hasn't loaded in 30 seconds, show error
        setTimeout(function() {
            if (loadAttempts === 0) {
                // Check if iframe appears to be loading (heuristic)
                try {
                    if (!appFrame.contentWindow || !appFrame.contentDocument) {
                        // This might throw due to CORS, which is fine
                    }
                } catch (e) {
                    // CORS error means iframe is loading external content - good!
                }
            }
        }, 30000);
    </script>
</body>
</html>
