<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>monAI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, #f3f6fa 0%, #e9eafc 100%); }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        .container {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 2rem;
            position: relative; z-index: 10;
        }
        .logo {
            font-size: 3.5rem; font-weight: 700; margin-bottom: 2rem;
            background: linear-gradient(90deg, #2196f3 0%, #4caf50 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #666; font-size: 1.1rem; margin-bottom: 3rem; }
        .server-btns { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 320px; }
        .server-btn {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: white; border: none; padding: 1.2rem 1.5rem; border-radius: 16px;
            font-size: 1rem; cursor: pointer; text-align: left;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .server-btn:active { transform: scale(0.98); }
        .server-btn.local {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .server-btn-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
        .server-btn-url { font-size: 0.75rem; opacity: 0.85; word-break: break-all; }
        .server-btn-desc { font-size: 0.8rem; opacity: 0.9; margin-top: 0.3rem; }
        .note { color: #999; font-size: 0.85rem; margin-top: 2rem; text-align: center; max-width: 300px; line-height: 1.5; }
        .hidden { display: none !important; }
        .back-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(0,0,0,0.7); color: white; border: none;
            padding: 12px 20px; border-radius: 25px; font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="menu">
        <div class="logo">monAI</div>
        <div class="subtitle">Budget Tracker</div>

        <div class="server-btns" id="server-btns"></div>

        <div class="note">
            Choose Ngrok when outside home network.<br>
            Choose Local when on your home WiFi.
        </div>
    </div>

    <iframe id="app" class="hidden"></iframe>
    <button id="back-btn" class="back-btn hidden">← Back to Menu</button>

    <script>
        // Server URLs - Run "node configure.js" to set these from .env
        const SERVERS = [
            {
                name: 'Ngrok',
                url: 'NGROK_URL_PLACEHOLDER',
                desc: 'External access (anywhere)'
            },
            {
                name: 'Local',
                url: 'LOCAL_URL_PLACEHOLDER',
                desc: 'Home network only'
            }
        ].filter(s => s.url && !s.url.includes('PLACEHOLDER'));

        const menuEl = document.getElementById('menu');
        const appEl = document.getElementById('app');
        const backBtn = document.getElementById('back-btn');
        const serverBtnsEl = document.getElementById('server-btns');

        function showMenu() {
            menuEl.classList.remove('hidden');
            appEl.classList.add('hidden');
            backBtn.classList.add('hidden');
            appEl.src = '';
        }

        function loadServer(url) {
            menuEl.classList.add('hidden');
            appEl.classList.remove('hidden');
            backBtn.classList.remove('hidden');
            appEl.src = url;
        }

        // Create buttons
        SERVERS.forEach((server) => {
            const btn = document.createElement('button');
            btn.className = 'server-btn' + (server.name === 'Local' ? ' local' : '');
            btn.innerHTML = `
                <div class="server-btn-name">${server.name}</div>
                <div class="server-btn-desc">${server.desc}</div>
                <div class="server-btn-url">${server.url}</div>
            `;
            btn.onclick = () => loadServer(server.url);
            serverBtnsEl.appendChild(btn);
        });

        // Back button
        backBtn.onclick = showMenu;

        // Handle iframe load errors
        appEl.onerror = () => {
            alert('Failed to connect. Please try another server.');
            showMenu();
        };
    </script>
</body>
</html>
