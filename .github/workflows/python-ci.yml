name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Black check
        run: python -m black --check --line-length=100 budgetapp/ budget_tracker/ accounts/ script_runner/

      - name: Flake8
        run: python -m flake8 --max-line-length=100 budgetapp/ budget_tracker/ accounts/ script_runner/

      - name: Bandit
        run: python -m bandit -r budgetapp budget_tracker accounts script_runner --skip B311,B101,B404,B603

      - name: Mypy
        run: python -m mypy budgetapp budget_tracker accounts script_runner

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only-must-be-at-least-fifty-characters-long
          DEBUG: "true"
        run: |
          python manage.py test budgetapp.tests.test_goals \
            budgetapp.tests.test_debt_tag_and_pdf_context \
            budgetapp.tests.test_mobile_sync
