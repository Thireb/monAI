# Build the Flutter Android release APK and upload it as a downloadable artifact.
#
# Download: GitHub → Actions → select latest run → Artifacts → monai-budget-release-apk
# Artifacts are kept per repository retention (default ~90 days).
#
# Signed updates on your phone: add repository secrets (Settings → Secrets and variables
# → Actions). See mobile/budget_mobile/README.md → "Release signing (GitHub Actions only)".

name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/budget_mobile/**"
      - ".github/workflows/flutter-apk.yml"
  pull_request:
    paths:
      - "mobile/budget_mobile/**"
      - ".github/workflows/flutter-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/budget_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test

      # Push / workflow_dispatch: must sign with upload keystore (secrets).
      # Pull requests: omit these steps so CI can use debug signing without secrets.
      - name: Require upload keystore secrets (non-PR only)
        if: github.event_name != 'pull_request'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_UPLOAD_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Add repository secrets: ANDROID_UPLOAD_KEYSTORE_BASE64," \
              "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS." \
              "See mobile/budget_mobile/README.md (Release signing — GitHub Actions only)."
            exit 1
          fi

      - name: Configure release keystore from secrets (non-PR only)
        if: github.event_name != 'pull_request'
        working-directory: mobile/budget_mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monai-budget-release-apk
          path: mobile/budget_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
