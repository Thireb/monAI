# =============================================================================
# monAI Budget Tracker - Configuration File
# =============================================================================
# This is the single source of truth for all configuration settings.
# Copy this file to config.yaml and customize for your environment.
# =============================================================================

# -----------------------------------------------------------------------------
# Application Settings
# -----------------------------------------------------------------------------
app:
  name: "monAI"
  version: "1.0.0"  # Used by run_scripts to determine which migrations to run
  debug: true
  # Generate a secure key for production: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  secret_key: "django-insecure-change-this-in-production-use-a-long-random-string"

# -----------------------------------------------------------------------------
# Server Settings
# -----------------------------------------------------------------------------
server:
  # Hosts allowed to access the application
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "*.ngrok-free.app"
    - "*.ngrok.io"
    - "preinstructive-dilan-evaluatingly.ngrok-free.dev"
    - "monai.onrender.com"
  
  # Timezone for the application
  timezone: "Asia/Karachi"

# -----------------------------------------------------------------------------
# URLs for APK Building
# -----------------------------------------------------------------------------
urls:
  # Local development server (your machine's IP on local network)
  local: "http://192.168.1.100:8000"
  
  # Ngrok URL for external access (update this when ngrok restarts)
  ngrok: "https://preinstructive-dilan-evaluatingly.ngrok-free.dev"

# -----------------------------------------------------------------------------
# Database Settings
# -----------------------------------------------------------------------------
database:
  engine: "sqlite3"
  name: "db.sqlite3"

# -----------------------------------------------------------------------------
# Celery Settings (Background Tasks)
# -----------------------------------------------------------------------------
celery:
  broker_url: "redis://localhost:6379/0"
  result_backend: "redis://localhost:6379/0"

# -----------------------------------------------------------------------------
# Email Settings
# -----------------------------------------------------------------------------
email:
  # Use "console" for development (prints to terminal)
  # Use "smtp" for production SMTP
  # Use "resend" for Resend API (recommended for production)
  #   - Sends styled HTML emails for verification and password reset
  #   - Also used for PDF budget report emails
  #   - Uses django-anymail backend for Django email integration
  backend: "resend"
  
  # SMTP settings (only used when backend is "smtp")
  smtp:
    host: "smtp.gmail.com"
    port: 587
    use_tls: true
    user: ""
    password: ""
    default_from: "noreply@monai.app"
  
  # Resend settings (used when backend is "resend")
  # Get API key from https://resend.com/api-keys
  # Free tier: 3,000 emails/month
  # When enabled, all Django emails (verification, password reset) go through Resend
  # PDF email feature also uses Resend directly via SDK
  resend:
    api_key: "re_GEwxWm8P_JzwnLFsqWj145P6AHxuUSqub"
    from_email: "onboarding@resend.dev"  # Use verified domain in production

# -----------------------------------------------------------------------------
# Initial Superuser (for setup_superuser command)
# -----------------------------------------------------------------------------
superuser:
  email: ""
  username: ""
  password: ""

