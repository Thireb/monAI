{% extends "account/base.html" %}
{% load static %}

{% block title %}Password Changed - monAI{% endblock title %}

{% block content %}
<div class="auth-header">
    <h1 class="auth-title">Password Changed!</h1>
    <p class="auth-subtitle">Your password has been successfully updated</p>
</div>

<div class="success-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
</div>

<div class="auth-actions">
    <a href="{% url 'account_login' %}" class="btn btn-primary btn-auth">
        Sign In Now
    </a>
</div>

<div class="auth-footer">
    <p>You can now sign in with your new password</p>
</div>
{% endblock content %}
