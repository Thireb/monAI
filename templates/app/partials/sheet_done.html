{# Answer to a save or delete in the edit sheet: empties the sheet (the script closes it) and shows a toast. Context: message. #}
<div data-sheet-done></div>
<div hx-swap-oob="beforeend:#toasts">
    <div class="toast" data-autoclose="4000" role="status">
        <span>{{ message }}</span>
        <button type="button" class="icon-btn" data-close-toast aria-label="Close">✕</button>
    </div>
</div>
