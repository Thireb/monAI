<!-- Transfer between account tags modal -->
<!-- djlint:off H021 -->
<div id="transferModal" class="modal-minimal" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="transferModalLabel" style="display: none;">
    <!-- djlint:on H021 -->
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="transferModalLabel">Transfer between accounts</h3>
        </div>
        <form method="post" id="transfer-form" class="transfer-form"
            action="{% url 'minimal:tag_transfer_create' year=budget.month.year month=budget.month.month %}">
            {% csrf_token %}
            <div class="modal-body">
                <!-- djlint:off H021 -->
                <div class="alert alert-danger form-errors" style="display: none;"></div>
                <!-- djlint:on H021 -->
                <p class="form-text mb-3">
                    Moves allocation between account tags. Does not change remaining budget.
                </p>
                <div class="mb-3">
                    <label for="transfer_from_tag" class="form-label">From account</label>
                    <select name="from_tag" id="transfer_from_tag" class="form-select" required
                        aria-label="From account tag">
                        <option value="">Select account</option>
                        {% for tag in tags %}
                        <option value="{{ tag.id }}">{{ tag.name|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="transfer_to_tag" class="form-label">To account</label>
                    <select name="to_tag" id="transfer_to_tag" class="form-select" required
                        aria-label="To account tag">
                        <option value="">Select account</option>
                        {% for tag in tags %}
                        <option value="{{ tag.id }}">{{ tag.name|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="transfer_amount" class="form-label">Amount</label>
                    <input type="number" step="0.01" min="0.01" name="amount" class="form-control"
                        id="transfer_amount" placeholder="Enter amount" required
                        aria-label="Transfer amount">
                    <div class="form-text">Amount in {{ budget.currency }}</div>
                </div>
                <div class="mb-3">
                    <label for="transfer_note" class="form-label">Note (optional)</label>
                    <input type="text" name="note" class="form-control" id="transfer_note"
                        maxlength="255" placeholder="e.g., Moved to savings wallet"
                        aria-label="Transfer note">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-minimal" aria-label="Cancel">Cancel</button>
                <button type="submit" class="btn btn-minimal btn-action">Transfer</button>
            </div>
        </form>
    </div>
</div>
