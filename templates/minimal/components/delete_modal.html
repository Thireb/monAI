<!-- Reusable Delete Confirmation Modal Component -->
<!-- Usage: include "minimal/components/delete_modal.html" with modal_id="deleteTagModal" title="Delete Tag" item_name_id="deleteTagName" confirm_btn_id="confirmDeleteTagBtn" -->
<!-- djlint:off H021 -->
<div id="{{ modal_id }}" class="modal-minimal" tabindex="-1" role="dialog"
    aria-modal="true" aria-labelledby="{{ modal_id }}Label" style="display: none;">
    <!-- djlint:on H021 -->
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="{{ modal_id }}Label">{{ title|default:"Confirm Delete" }}</h3>
            <button type="button" class="btn-close" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete "<span id="{{ item_name_id }}"></span>"?</p>
            <p class="text-danger"><small>This action cannot be undone.</small></p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-minimal" aria-label="Cancel">Cancel</button>
            <button type="button" class="btn btn-minimal btn-danger" id="{{ confirm_btn_id }}">Delete</button>
        </div>
    </div>
</div>
