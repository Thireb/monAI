[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "types-PyYAML",
    "types-python-dateutil",
    "playwright>=1.64.0",
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "attr-defined", "arg-type", "union-attr", "operator", "assignment"]
exclude = "(?x)(^|.*/)(migrations|venv|staticfiles|node_modules)/"

[tool.django-stubs]
django_settings_module = "budget_tracker.settings"
