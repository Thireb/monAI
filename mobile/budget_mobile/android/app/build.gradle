plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// budget-notes style: keystore.properties + keystore/*.jks at the monAI repo root.
// Fallbacks: mobile/budget_mobile/keystore.properties, then android/key.properties.
def keystoreProperties = new Properties()
def repoRoot = rootProject.file("../..")
def keystorePropertiesFile = new File(repoRoot, "keystore.properties")
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file("../keystore.properties")
}
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file("key.properties")
}
def keystoreBaseDir = keystorePropertiesFile.parentFile
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.monai.budget.budget_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.monai.budget.budget_mobile"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                def storePath = keystoreProperties["storeFile"] as String
                // Paths in keystore.properties are relative to that file's directory.
                storeFile new File(keystoreBaseDir, storePath)
                if (!storeFile.exists()) {
                    // Legacy android/key.properties: path relative to android/app/
                    storeFile file(storePath)
                }
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // Local experimentation only — do not ship this to Releases.
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

flutter {
    source = "../.."
}
